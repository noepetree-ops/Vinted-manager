<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071014">
<title>Vinted Manager V9.1.8</title>
<style>
:root{--bg:#071014;--panel:#0d1a20;--panel2:#12232a;--line:#ffffff14;--text:#f4f7f8;--muted:#91a0a6;--cyan:#19decf;--green:#22d77a;--orange:#ffad4d;--red:#ff6673;--blue:#5aaeff;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#19decf12,transparent 30%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.side{position:fixed;inset:0 auto 0 0;width:245px;background:#091419f5;border-right:1px solid var(--line);padding:18px;z-index:20}.brand{font-size:20px;font-weight:850;margin:5px 8px 25px}.brand b{color:var(--cyan)}
.side nav{display:grid;gap:6px}.side nav button,.mobile-nav button{border:1px solid transparent;background:none;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left}.side nav button.active,.mobile-nav button.active{background:#19decf12;border-color:#19decf2a;color:var(--cyan)}
.main{margin-left:245px;min-height:100vh;padding:24px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.sync{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--orange)}.sync.ok .dot{background:var(--green)}.sync.err .dot{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(145deg,#0d1b20,#091419);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.kpi .v{font-size:25px;font-weight:850;margin-top:7px}.section{margin-top:14px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);padding:9px 12px;border-radius:10px}.btn.primary{background:var(--cyan);color:#03100f;border-color:var(--cyan);font-weight:800}.btn.danger{color:#ff9ca5;border-color:#ff667344}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#081116;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;outline:none}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.check{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--text)!important}.check input{width:auto}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;background:#ffffff0a;color:var(--muted)}.badge.green{color:var(--green);background:#22d77a12}.badge.blue{color:var(--cyan);background:#19decf12}.badge.orange{color:var(--orange);background:#ffad4d12}.badge.red{color:var(--red);background:#ff667312}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.photo{width:55px;height:55px;object-fit:cover;border-radius:10px;background:#111b1f}.photo-lg{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#091419}
.periods{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.chart-controls{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px}.chart-controls label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.chart-controls input{width:auto}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px;font-size:11px;color:var(--muted)}.chart-legend span{display:inline-flex;align-items:center;gap:5px}.chart-dot{width:9px;height:9px;border-radius:3px;display:inline-block}.category-pills{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px;overflow-x:auto;overflow-y:hidden;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}.category-pills button{border:1px solid var(--line);background:#ffffff06;color:var(--muted);padding:8px 11px;border-radius:999px;font-size:11px;white-space:nowrap;flex:0 0 auto}.category-pills button.active{color:var(--cyan);border-color:#19decf55;background:#19decf12}.periods button{white-space:nowrap}.periods button.active{background:#19decf12;border-color:#19decf55;color:var(--cyan)}
.bar-chart{height:210px;display:flex;align-items:end;gap:8px;padding:15px 5px 0}.bar{flex:1;min-width:10px;background:var(--cyan);border-radius:7px 7px 2px 2px;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}.bar small{position:absolute;top:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted)}
.progress{height:8px;background:#ffffff0a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--cyan);border-radius:99px}.modal{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#0d1b20,#071014);border:1px solid #19decf2b;border-radius:18px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.close{border:0;background:none;color:var(--text);font-size:20px}
.notice{padding:11px 13px;border:1px solid var(--line);background:#ffffff05;border-radius:11px;color:var(--muted);line-height:1.45}.mobile-nav{display:none}.hidden{display:none!important}.right{margin-left:auto}.stat-note{font-size:11px;color:var(--muted);margin-top:5px}.list{display:grid;gap:9px}.list-row{display:grid;grid-template-columns:55px 1fr auto;gap:11px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#ffffff03}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:720px){.category-pills{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding-bottom:5px;scrollbar-width:thin}.category-pills button{flex:0 0 auto;min-height:42px;padding:9px 13px;font-size:12px}.chart-controls{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chart-controls label{flex:0 0 auto;min-height:40px}.periods{flex-wrap:nowrap}.periods .btn{flex:0 0 auto;}body{padding-bottom:76px}.side{display:none}.main{margin:0;padding:15px 13px 24px}.top h1{font-size:23px}.top{align-items:flex-start}.top .sync{font-size:10px;padding:7px}.grid,.grid3{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.mobile-nav{display:flex;position:fixed;z-index:50;bottom:0;left:0;right:0;min-height:68px;background:#081216f5;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:6px 5px calc(6px + env(safe-area-inset-bottom));gap:3px;overflow-x:auto}.mobile-nav button{flex:0 0 72px;text-align:center;padding:7px 4px;font-size:10px}.mobile-nav .ico{display:block;font-size:17px;line-height:20px}.table th,.table td{padding:9px;font-size:12px}.modal{padding:9px}.modalbox{padding:14px}.actions{flex-wrap:wrap}.actions .btn{flex:1}.periods{padding-bottom:2px}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><b>V</b> Vinted Manager <span class="muted">V9</span></div>
  <nav id="sideNav"></nav>
</aside>
<nav class="mobile-nav" id="mobileNav"></nav>
<main class="main">
  <div class="top">
    <div><h1 id="pageTitle">Statistiques</h1><div class="muted" id="subTitle">Gestion de ta rentabilité Vinted</div></div>
    <div id="sync" class="sync"><i class="dot"></i><span id="syncText">Non connecté</span></div>
  </div>
  <div id="app"></div>
</main>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const APP_VERSION='V9.1.8';
const SYNC_ROW_ID='vinted-manager-v9-main';
const CFG_KEY='vinted_v9_supabase';
const LOCAL_KEY='vinted_v9_local';
const NAV=[
  ['stats','📊','Statistiques'],['listings','🛍️','Mes annonces'],['investments','💰','Investissements'],
  ['articles','📦','Articles'],['sales','✅','Vendus'],['boosts','🚀','Boost'],['settings','⚙️','Paramètres']
];
let page='stats', period='all', cloud=null, realtime=null, saving=false, editingId=null, saleArticleId=null;
const CATEGORIES=['Polaire','T-shirt','Sweat','Pull','Veste','Manteau','Pantalon','Jean','Short','Chaussures','Chemise','Accessoire','Sac','Casquette','Autre'];
let statsCategory='all';

let state=loadLocal();
state.boosts=Array.isArray(state.boosts)?state.boosts:[];
function emptyState(){return {version:APP_VERSION,updated_at:null,investments:[],articles:[],sales:[],boosts:[]};}
function loadLocal(){try{const raw=localStorage.getItem(LOCAL_KEY);if(!raw)return emptyState();const x=JSON.parse(raw);if(!x||typeof x!=='object')return emptyState();const known=['V9','V9.1.1','V9.1.2','V9.1.3','V9.1.4','V9.1.5','V9.1.6','V9.1.7','V9.1.8'];if(x.version&&!known.includes(x.version))return emptyState();const out=Object.assign(emptyState(),x,{version:APP_VERSION});out.investments=Array.isArray(out.investments)?out.investments:[];out.articles=Array.isArray(out.articles)?out.articles:[];out.sales=Array.isArray(out.sales)?out.sales:[];out.boosts=Array.isArray(out.boosts)?out.boosts:[];return out}catch{return emptyState()}}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num=n=>{const v=String(n??'').trim().replace(',','.');const x=Number(v);return Number.isFinite(x)?x:0};
const uid=()=>crypto.randomUUID();
const isoDate=d=>new Date(d).toISOString();
function setSync(kind,text){$('#sync').className='sync '+kind;$('#syncText').textContent=text}
function nav(){for(const id of ['sideNav','mobileNav']){$('#'+id).innerHTML=NAV.map(([k,ico,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${ico}</span>${t}</button>`).join('')}}
function go(p){page=p;nav();render()}
function toast(msg){setSync('ok',msg);clearTimeout(window.__toast);window.__toast=setTimeout(()=>{if(cloud)setSync('ok','Synchronisé ✓')},2200)}
function periodRange(){
  const now=new Date(), start=new Date(now);
  if(period==='today'){start.setHours(0,0,0,0)}
  if(period==='week'){const day=(now.getDay()+6)%7;start.setDate(now.getDate()-day);start.setHours(0,0,0,0)}
  if(period==='month'){start.setDate(1);start.setHours(0,0,0,0)}
  if(period==='year'){start.setMonth(0,1);start.setHours(0,0,0,0)}
  return period==='all'?null:{start,end:now}
}
function inPeriod(date){const r=periodRange();return !r||(new Date(date)>=r.start&&new Date(date)<=r.end)}
function investmentFor(a){return state.investments.find(i=>i.id===a.investment_id)}
function saleFor(a){return state.sales.find(s=>s.article_id===a.id)}
function articleCost(a){return num(a.purchase_price)}
function saleNet(s){return num(s.sale_price)-num(s.fees)}
function categoryMatch(a){return statsCategory==='all'||(a.category||'Autre')===statsCategory}
function unlinkedArticleCostInPeriod(){return state.articles.filter(a=>!a.investment_id&&inPeriod(a.created_at||a.date)).reduce((n,a)=>n+articleCost(a),0)}
function totalInvestedForPeriod(){const explicit=state.investments.filter(i=>inPeriod(i.date)).reduce((n,i)=>n+num(i.cost),0);return explicit+unlinkedArticleCostInPeriod()}
function totalBoostsForPeriod(){return state.boosts.filter(b=>inPeriod(b.date||b.created_at)).reduce((n,b)=>n+num(b.amount),0)}
function stockPotentialValue(){return state.articles.filter(a=>a.status==='for_sale').reduce((n,a)=>n+num(a.sale_price),0)}
function stats(){
  const articles=state.articles.filter(a=>inPeriod(a.created_at||a.date)&&categoryMatch(a));
  const sales=state.sales.filter(s=>inPeriod(s.sold_at)&&categoryMatch(state.articles.find(a=>a.id===s.article_id)||{}));
  const soldIds=new Set(sales.map(s=>s.article_id));
  const listed=state.articles.filter(a=>a.status==='for_sale'&&categoryMatch(a)&&!soldIds.has(a.id));
  const invested=totalInvestedForPeriod();
  const revenue=sales.reduce((n,s)=>n+saleNet(s),0);
  const costSold=sales.reduce((n,s)=>n+articleCost(state.articles.find(a=>a.id===s.article_id)||{}),0);
  const boosts=totalBoostsForPeriod();
  const profit=revenue-costSold-boosts;
  return {articles,sales,listed,invested,revenue,costSold,boosts,profit,roi:invested?profit/invested*100:0,avgSale:sales.length?revenue/sales.length:0,avgCost:articles.length?invested/articles.length:0,stockValue:stockPotentialValue()};
}
function chartBuckets(){
  const sales=state.sales.filter(s=>inPeriod(s.sold_at)&&categoryMatch(state.articles.find(a=>a.id===s.article_id)||{}));
  const investments=state.investments.filter(i=>inPeriod(i.date));
  const unlinked=state.articles.filter(a=>!a.investment_id&&inPeriod(a.created_at||a.date));
  const boosts=state.boosts.filter(b=>inPeriod(b.date||b.created_at));
  const buckets=new Map();
  function keyFor(d){const x=new Date(d);if(period==='today')return `${x.getHours().toString().padStart(2,'0')}h`;if(period==='week')return x.toLocaleDateString('fr-BE',{weekday:'short'});if(period==='month')return x.toLocaleDateString('fr-BE',{day:'2-digit'});if(period==='year')return x.toLocaleDateString('fr-BE',{month:'short'});return x.toLocaleDateString('fr-BE',{month:'short',year:'2-digit'});}
  function ensure(k){if(!buckets.has(k))buckets.set(k,{invest:0,sales:0,profit:0,boost:0,order:buckets.size});return buckets.get(k)}
  investments.forEach(i=>ensure(keyFor(i.date)).invest+=num(i.cost));
  unlinked.forEach(a=>ensure(keyFor(a.created_at||a.date)).invest+=articleCost(a));
  sales.forEach(s=>{const b=ensure(keyFor(s.sold_at));b.sales+=saleNet(s);const a=state.articles.find(x=>x.id===s.article_id)||{};b.profit+=saleNet(s)-articleCost(a)});
  boosts.forEach(b=>{ensure(keyFor(b.date||b.created_at)).boost+=num(b.amount);});
  for(const b of buckets.values())b.profit-=b.boost;
  let rows=[...buckets.entries()];if(period==='week'){const order=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];rows.sort((a,b)=>order.indexOf(a[0].toLowerCase())-order.indexOf(b[0].toLowerCase()))}else rows.sort((a,b)=>a[1].order-b[1].order);
  return rows.slice(-12).map(([label,v])=>({label,...v}));
}
function statsChart(){
  const rows=chartBuckets(); if(!rows.length)return '<div class="empty">Pas encore assez de données pour afficher le graphique.</div>';
  const visible={invest:document.getElementById('chartInvest')?.checked!==false,sales:document.getElementById('chartSales')?.checked!==false,profit:document.getElementById('chartProfit')?.checked!==false};
  const series=[['invest','Investissements','#19decf'],['sales','Ventes','#22d77a'],['profit','Bénéfice / perte','#ffad4d']].filter(x=>visible[x[0]]);
  if(!series.length)return '<div class="empty">Sélectionne au moins une courbe.</div>';
  const W=820,H=280,left=52,right=16,top=20,bottom=42,iw=W-left-right,ih=H-top-bottom;
  const max=Math.max(1,...rows.flatMap(r=>series.map(x=>Math.abs(r[x[0]]))));
  const y=v=>top+ih/2-(v/max)*(ih/2-10),zero=top+ih/2;const x=i=>left+(rows.length===1?iw/2:(i/(rows.length-1))*iw);
  const line=(key)=>rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(t=>{const yy=top+ih*t;const val=(1-t*2)*max;return `<line x1="${left}" y1="${yy}" x2="${W-right}" y2="${yy}" stroke="#ffffff12"/><text x="${left-8}" y="${yy+3}" text-anchor="end" fill="#91a0a6" font-size="9">${Math.round(val)} €</text>`}).join('');
  const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#91a0a6" font-size="9">${esc(r.label)}</text>`).join('');
  const draw=x=>`<polyline points="${line(x[0])}" fill="none" stroke="${x[2]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[x[0]])}" r="3.5" fill="${x[2]}"/>`).join('');
  return `<div class="chart-controls"><label><input id="chartInvest" type="checkbox" ${visible.invest?'checked':''} onchange="render()"> Investissements</label><label><input id="chartSales" type="checkbox" ${visible.sales?'checked':''} onchange="render()"> Ventes</label><label><input id="chartProfit" type="checkbox" ${visible.profit?'checked':''} onchange="render()"> Bénéfice / perte</label></div><div style="overflow:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" height="280" role="img" aria-label="Graphique de rentabilité">${grid}<line x1="${left}" y1="${zero}" x2="${W-right}" y2="${zero}" stroke="#ffffff25"/>${series.map(draw).join('')}${labels}</svg></div>`;
}
function kpi(label,value,note=''){return `<div class="card kpi"><div class="muted">${label}</div><div class="v">${value}</div>${note?`<div class="stat-note">${note}</div>`:''}</div>`}
function render(){nav();const titles={stats:'Statistiques',listings:'Mes annonces',investments:'Investissements',boosts:'Boost',articles:'Articles',sales:'Articles vendus',settings:'Paramètres'};$('#pageTitle').textContent=titles[page];$('#subTitle').textContent=page==='settings'?'Synchronisation PC ↔ téléphone · Supabase':'Gestion réelle de ta rentabilité';$('#app').innerHTML=page==='stats'?statsPage():page==='listings'?listingsPage():page==='investments'?investmentsPage():page==='boosts'?boostsPage():page==='articles'?articlesPage():page==='sales'?salesPage():settingsPage()}
function statsPage(){
 const s=stats();
 return `<div class="periods">${[['today',"Aujourd'hui"],['week','Cette semaine'],['month','Ce mois'],['year','Cette année'],['all','Depuis toujours']].map(x=>`<button class="btn ${period===x[0]?'active':''}" onclick="setPeriod('${x[0]}')">${x[1]}</button>`).join('')}</div>
 <div class="category-pills"><button class="${statsCategory==='all'?'active':''}" onclick="setStatsCategory('all')">Toutes</button>${CATEGORIES.map(c=>`<button class="${statsCategory===c?'active':''}" onclick="setStatsCategory('${c}')">${c}</button>`).join('')}</div>
 <div class="notice" style="margin-bottom:12px">Données chargées : <b>${state.articles.length}</b> articles · <b>${state.investments.length}</b> investissements · <b>${state.sales.length}</b> ventes${state.boosts.length?` · <b>${state.boosts.length}</b> boosts`:''}</div><div class="grid">${kpi('Montant investi',money(s.invested))}${kpi('Montant des ventes',money(s.revenue))}${kpi('Articles achetés',s.articles.length)}${kpi('Articles vendus',s.sales.length)}</div>
 <div class="grid section">${kpi('Valeur potentielle du stock',money(s.stockValue),'Si tous les articles encore en vente sont vendus au prix prévu')}${kpi('Dépenses Boost',money(s.boosts))}${kpi('Bénéfice après Boost',money(s.profit))}${kpi('Articles encore en vente',s.listed.length)}</div>
 <div class="grid section">${kpi('Annonces en ligne',s.listed.length)}${kpi('Bénéfice réalisé',money(s.profit))}${kpi('Rentabilité',s.invested?money(s.roi).replace('€','%'): '0,00 %')}${kpi('Prix de vente moyen',money(s.avgSale))}</div>
 <div class="grid section">${kpi("Coût d'achat moyen",money(s.avgCost))}${kpi('Articles au total',state.articles.filter(categoryMatch).length)}${kpi('Investissements',state.investments.length)}${kpi('Ventes au total',state.sales.filter(x=>categoryMatch(state.articles.find(a=>a.id===x.article_id)||{})).length)}</div>
 <div class="card section"><h2>Évolution de l'activité</h2>${statsChart()}</div>
 <div class="grid3 section"><div class="card"><h3>Ventes récentes</h3>${salesMini(s.sales.slice().sort((a,b)=>new Date(b.sold_at)-new Date(a.sold_at)).slice(0,6))}</div><div class="card"><h3>Ventes par catégorie</h3>${categoryStats()}</div><div class="card"><h3>Résumé</h3><div class="notice">Les statistiques utilisent uniquement les données enregistrées dans cette V9. Aucun chiffre fictif n'est ajouté.${statsCategory!=='all'?` Filtre actif : <b>${esc(statsCategory)}</b>.`:''}</div></div></div>`
}
function setStatsCategory(c){statsCategory=c;render()}
function categoryStats(){
 const rows=CATEGORIES.map(c=>{const arts=state.articles.filter(a=>(a.category||'Autre')===c);const sales=state.sales.filter(s=>(state.articles.find(a=>a.id===s.article_id)?.category||'Autre')===c);const revenue=sales.reduce((n,s)=>n+saleNet(s),0);const cost=sales.reduce((n,s)=>n+articleCost(state.articles.find(a=>a.id===s.article_id)||{}),0);return {c,count:sales.length,revenue,profit:revenue-cost,invested:arts.reduce((n,a)=>n+articleCost(a),0)}}).filter(x=>x.count||x.invested).sort((a,b)=>b.profit-a.profit).slice(0,8);
 return rows.length?`<div class="list">${rows.map(r=>`<div class="list-row" style="grid-template-columns:1fr auto"><div><b>${esc(r.c)}</b><div class="muted">${r.count} vendu(s) · ${money(r.invested)} investi</div></div><strong>${money(r.profit)}</strong></div>`).join('')}</div>`:'<div class="empty">Aucune donnée par catégorie.</div>';
}
function setPeriod(p){period=p;render()}
function salesMini(rows){return rows.length?`<div class="list">${rows.map(s=>{const a=state.articles.find(x=>x.id===s.article_id);return `<div class="list-row"><div>${a?.photo?`<img class="photo" src="${a.photo}">`:'📦'}</div><div><b>${esc(a?.title||'Article')}</b><div class="muted">${new Date(s.sold_at).toLocaleDateString('fr-BE')}</div></div><strong>${money(s.sale_price)}</strong></div>`}).join('')}</div>`:'<div class="empty">Aucune vente sur cette période.</div>'}
function barChart(rows){if(!rows.length)return '<div class="empty">Aucune donnée.</div>';const buckets={};rows.forEach(s=>{const d=new Date(s.sold_at);const k=d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit'});buckets[k]=(buckets[k]||0)+saleNet(s)});const vals=Object.values(buckets),max=Math.max(...vals,1);return `<div class="bar-chart">${Object.entries(buckets).slice(-12).map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/max*160)}px"><span>${money(v)}</span><small>${k}</small></div>`).join('')}</div>`}
function listingsPage(){
 const arr=state.articles.filter(a=>a.status==='for_sale');return `<div class="toolbar"><button class="btn primary" onclick="openArticle()">+ Nouvelle annonce</button><input id="listingSearch" placeholder="Rechercher..." oninput="renderListingsFilter()" style="max-width:300px"><select id="listingCategory" onchange="renderListingsFilter()" style="max-width:220px"><option value="all">Toutes les catégories</option>${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div id="listingBox">${listingTable(arr)}</div>`;
}
function renderListingsFilter(){const q=($('#listingSearch')?.value||'').toLowerCase();const cat=$('#listingCategory')?.value||'all';const arr=state.articles.filter(a=>a.status==='for_sale'&&(`${a.title} ${a.type} ${a.brand} ${a.category||''}`.toLowerCase().includes(q))&&(cat==='all'||(a.category||'Autre')===cat));$('#listingBox').innerHTML=listingTable(arr)}
function listingTable(arr){return `<div class="card"><div class="table-wrap">${arr.length?`<table class="table"><tr><th>Photo</th><th>Article</th><th>Type</th><th>Catégorie</th><th>Prix</th><th>Investissement</th><th>Créée</th><th>Statut</th><th></th></tr>${arr.map(a=>{const i=investmentFor(a);return `<tr><td>${a.photo?`<img class="photo" src="${a.photo}">`:'—'}</td><td><b>${esc(a.title)}</b><div class="muted">${esc(a.brand||'')}</div></td><td>${esc(a.type||'')}</td><td>${esc(a.category||'Autre')}</td><td>${money(a.sale_price)}</td><td>${esc(i?.name||'—')}</td><td>${fmtDate(a.created_at)}</td><td><span class="badge blue">En vente</span></td><td><button class="btn primary" onclick="openSale('${a.id}')">VENDU</button></td></tr>`}).join('')}</table>`:'<div class="empty">Aucune annonce en vente.</div>'}</div></div>`}
function articlesPage(){return `<div class="toolbar"><button class="btn primary" onclick="openArticle()">+ Nouvel article</button><input id="articleSearch" placeholder="Rechercher..." oninput="renderArticlesFilter()" style="max-width:260px"><select id="articleCategory" onchange="renderArticlesFilter()" style="max-width:220px"><option value="all">Toutes les catégories</option>${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div id="articleBox">${articleTable(state.articles)}</div>`}
function renderArticlesFilter(){const q=($('#articleSearch')?.value||'').toLowerCase(),cat=$('#articleCategory')?.value||'all';const arr=state.articles.filter(a=>(`${a.title} ${a.brand||''} ${a.type||''} ${a.category||''}`.toLowerCase().includes(q))&&(cat==='all'||(a.category||'Autre')===cat));$('#articleBox').innerHTML=articleTable(arr)}
function articleTable(arr){return `<div class="card"><div class="table-wrap">${arr.length?`<table class="table"><tr><th>Article</th><th>Catégorie</th><th>Achat</th><th>Vente prévue</th><th>Investissement</th><th>Statut</th><th></th></tr>${arr.map(a=>`<tr><td>${esc(a.title)}</td><td>${esc(a.category||'Autre')}</td><td>${money(a.purchase_price)}</td><td>${money(a.sale_price)}</td><td>${esc(investmentFor(a)?.name||'—')}</td><td><span class="badge ${a.status==='sold'?'green':'blue'}">${a.status==='sold'?'Vendu':'En vente'}</span></td><td><button class="btn" onclick="openArticle('${a.id}')">Modifier</button></td></tr>`).join('')}</table>`:'<div class="empty">Aucun article.</div>'}</div></div>`}
function salesPage(){const arr=state.sales.slice().sort((a,b)=>new Date(b.sold_at)-new Date(a.sold_at));return `<div class="card"><div class="table-wrap">${arr.length?`<table class="table"><tr><th>Photo</th><th>Article</th><th>Vente</th><th>Achat</th><th>Bénéfice</th><th>Investissement</th><th>Date</th><th>Statut</th></tr>${arr.map(s=>{const a=state.articles.find(x=>x.id===s.article_id),p=saleNet(s)-articleCost(a||{});return `<tr><td>${a?.photo?`<img class="photo" src="${a.photo}">`:'—'}</td><td>${esc(a?.title||'Article')}</td><td>${money(s.sale_price)}</td><td>${money(a?.purchase_price)}</td><td>${money(p)}</td><td>${esc(investmentFor(a||{})?.name||'—')}</td><td>${fmtDate(s.sold_at)}</td><td><span class="badge green">Vendu</span></td></tr>`}).join('')}</table>`:'<div class="empty">Aucun article vendu.</div>'}</div></div>`}
function investmentsPage(){const unlinked=state.articles.filter(a=>!a.investment_id).reduce((n,a)=>n+articleCost(a),0);return `<div class="toolbar"><button class="btn primary" onclick="openInvestment()">+ Nouvel investissement / lot</button></div><div class="notice section">Les articles rattachés à un investissement ne sont pas ajoutés une deuxième fois au montant investi. Les articles sans investissement associé sont ajoutés individuellement (${money(unlinked)} actuellement).</div><div class="grid3 section">${state.investments.map(i=>investmentCard(i)).join('')||'<div class="empty">Aucun investissement.</div>'}</div>`}
function investmentCard(i){const linked=state.articles.filter(a=>a.investment_id===i.id),sold=linked.filter(a=>saleFor(a)),recovered=sold.reduce((n,a)=>n+saleNet(saleFor(a)),0),boosts=state.boosts.filter(b=>b.article_id&&linked.some(a=>a.id===b.article_id)).reduce((n,b)=>n+num(b.amount),0),profit=recovered-num(i.cost)-boosts,remaining=Math.max(0,num(i.cost)-recovered),roi=num(i.cost)?profit/num(i.cost)*100:0;return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(i.name)}</h3><span class="badge ${recovered>=num(i.cost)?'green':'orange'}">${recovered>=num(i.cost)?'Rentabilisé':'En cours'}</span></div><div class="muted">${fmtDate(i.date)} · ${i.types?.map(t=>esc(t.name)+' × '+t.qty).join(' · ')||''}</div><div class="section">${kpi('Coût total',money(i.cost))}</div><div class="grid3 section">${kpi('Articles',i.total_articles)}${kpi('Vendus',sold.length)}${kpi('Restants',Math.max(0,num(i.total_articles)-sold.length))}</div><div class="section"><div class="muted">Montant généré</div><h3>${money(recovered)}</h3><div class="progress"><i style="width:${Math.min(100,recovered/Math.max(1,num(i.cost))*100)}%"></i></div></div><div class="grid3 section">${kpi('Bénéfice',money(profit))}${kpi('Rentabilité',roi.toFixed(2)+' %')}${kpi('Reste à récupérer',money(remaining))}</div><div class="actions"><button class="btn" onclick="openInvestment('${i.id}')">Modifier</button></div></div>`}
function boostsPage(){const rows=state.boosts.slice().sort((a,b)=>new Date(b.date||b.created_at)-new Date(a.date||a.created_at));const total=state.boosts.reduce((n,b)=>n+num(b.amount),0);return `<div class="toolbar"><button class="btn primary" onclick="openBoost()">+ Ajouter un Boost</button></div><div class="grid">${kpi('Total Boost dépensé',money(total))}${kpi('Nombre de Boosts',state.boosts.length)}</div><div class="card section"><div class="table-wrap">${rows.length?`<table class="table"><tr><th>Date</th><th>Article</th><th>Montant</th><th>Note</th><th></th></tr>${rows.map(b=>{const a=state.articles.find(x=>x.id===b.article_id);return `<tr><td>${fmtDate(b.date||b.created_at)}</td><td>${esc(a?.title||'Tous / non associé')}</td><td>${money(b.amount)}</td><td>${esc(b.note||'')}</td><td><button class="btn danger" onclick="removeBoost('${b.id}')">Supprimer</button></td></tr>`}).join('')}</table>`:'<div class="empty">Aucun Boost enregistré.</div>'}</div></div>`}
function openBoost(){openModal('Ajouter un Boost',`<div class="form"><div class="field"><label>Montant du Boost (€) *</label><input id="bAmount" type="number" step=".01" min="0" placeholder="2.50"></div><div class="field"><label>Date *</label><input id="bDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Article associé (optionnel)</label><select id="bArticle"><option value="">Tous / non associé</option>${state.articles.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></div><div class="field full"><label>Note</label><input id="bNote" placeholder="Ex. Boost 3 jours"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveBoost()">Enregistrer</button></div>`)}
async function saveBoost(){const amount=num($('#bAmount').value);if(amount<=0)return alert('Le montant du Boost doit être supérieur à 0 €.');const b={id:uid(),amount,date:$('#bDate').value||new Date().toISOString().slice(0,10),article_id:$('#bArticle').value||null,note:$('#bNote').value.trim(),created_at:isoDate(new Date())};state.boosts.push(b);saveLocal();closeModal();render();await pushCloud()}
async function removeBoost(id){if(!confirm('Supprimer ce Boost ?'))return;state.boosts=state.boosts.filter(b=>b.id!==id);saveLocal();render();await pushCloud()}
function settingsPage(){const cfg=getCfg();return `<div class="grid3"><div class="card"><h2>☁️ Synchronisation</h2><p class="muted">Les deux appareils utilisent la même ligne Supabase V9.</p><div class="notice">Après avoir enregistré l'URL et la clé sur le PC, utilise exactement les mêmes valeurs sur le téléphone.</div><p id="syncInfo" class="stat-note">${cloud?'Cloud connecté':'Cloud non connecté'}</p></div><div class="card"><h2>Supabase</h2><div class="form"><div class="field full"><label>Project URL</label><input id="cfgUrl" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"></div><div class="field full"><label>Publishable key</label><input id="cfgKey" value="${esc(cfg.key)}" placeholder="sb_publishable_..."></div></div><div class="actions"><button class="btn primary" onclick="connectCloud()">Tester et connecter</button><button class="btn" onclick="disconnectCloud()">Déconnecter</button></div></div><div class="card"><h2>Données locales</h2><p class="muted">Une copie locale est conservée pour éviter de perdre une saisie si Internet coupe.</p><div class="actions"><button class="btn" onclick="forcePull()">Recharger depuis Supabase</button><button class="btn" onclick="downloadBackup()">Exporter</button><button class="btn" onclick="importBackup()">Importer</button></div></div></div>`}
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{url:'',key:''}}catch{return {url:'',key:''}}}
async function connectCloud(){const url=$('#cfgUrl').value.trim().replace(/\/$/,''),key=$('#cfgKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||key.length<20)return alert('Project URL ou clé Publishable invalide.');localStorage.setItem(CFG_KEY,JSON.stringify({url,key}));try{cloud=window.supabase.createClient(url,key,{auth:{persistSession:false}});const {error}=await cloud.from('vinted_v9_state').select('id').eq('id',SYNC_ROW_ID).maybeSingle();if(error)throw error;setSync('ok','Cloud connecté ✓');await pullCloud();subscribeRealtime();render()}catch(e){cloud=null;setSync('err','Erreur Supabase');alert('Impossible de se connecter : '+e.message)}}
function disconnectCloud(){if(realtime&&cloud)cloud.removeChannel(realtime);realtime=null;cloud=null;setSync('','Déconnecté');render()}
async function ensureCloud(){if(cloud)return true;const c=getCfg();if(!c.url||!c.key)return false;try{cloud=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false}});return true}catch{return false}}
async function pullCloud(){
  if(!await ensureCloud())return;
  setSync('','Synchronisation…');
  const localBefore=Object.assign(emptyState(),state);
  try{
    const {data,error}=await cloud.from('vinted_v9_state').select('state,updated_at').eq('id',SYNC_ROW_ID).maybeSingle();
    if(error)throw error;
    const remote=data?.state&&typeof data.state==='object'?data.state:null;
    const localCount=(localBefore.articles?.length||0)+(localBefore.investments?.length||0)+(localBefore.sales?.length||0);
    const remoteCount=(remote?.articles?.length||0)+(remote?.investments?.length||0)+(remote?.sales?.length||0);
    if(remote&&remoteCount>0){
      state=Object.assign(emptyState(),remote,{version:APP_VERSION});
      state.investments=Array.isArray(state.investments)?state.investments:[];
      state.articles=Array.isArray(state.articles)?state.articles:[];
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.boosts=Array.isArray(state.boosts)?state.boosts:[];
      state.updated_at=data.updated_at||state.updated_at;
      saveLocal();
    }else if(localCount>0){
      state=localBefore;
      await pushCloud();
      setSync('ok','Données locales conservées ✓');
      render();
      return;
    }else{
      state=Object.assign(emptyState(),remote||{});
      saveLocal();
    }
    setSync('ok','Synchronisé ✓');
    render();
  }catch(e){
    state=localBefore;
    saveLocal();
    setSync('err','Cloud indisponible · données locales conservées');
    render();
    console.error(e);
  }
}
function subscribeRealtime(){if(!cloud)return;if(realtime)cloud.removeChannel(realtime);realtime=cloud.channel('vinted-v9-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'vinted_v9_state',filter:`id=eq.${SYNC_ROW_ID}`},p=>{if(!saving&&p.new?.state){state=Object.assign(emptyState(),p.new.state);saveLocal();render();setSync('ok','Mis à jour depuis un autre appareil ✓')}}).subscribe()}
async function forcePull(){try{await pullCloud()}catch(e){alert(e.message)}}
function fmtDate(d){return d?new Date(d).toLocaleDateString('fr-BE'):'—'}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');editingId=null;saleArticleId=null}
function openArticle(id=null){editingId=id;const a=state.articles.find(x=>x.id===id)||{};openModal(id?'Modifier l’article':'Nouvel article',`<div class="form">
<div class="field full"><label>Nom de l'article *</label><input id="aTitle" value="${esc(a.title||'')}"></div>
<div class="field"><label>Type</label><input id="aType" value="${esc(a.type||'')}"></div><div class="field"><label>Marque</label><input id="aBrand" value="${esc(a.brand||'')}"></div>
<div class="field"><label>Prix d'achat (€) *</label><input id="aBuy" type="number" step=".01" value="${a.purchase_price??''}"></div><div class="field"><label>Prix de vente prévu (€)</label><input id="aSale" type="number" step=".01" value="${a.sale_price??''}"></div>
<div class="field"><label>Taille</label><input id="aSize" value="${esc(a.size||'')}"></div><div class="field"><label>État</label><input id="aCond" value="${esc(a.condition||'')}"></div>
<div class="field full"><label>Catégorie</label><select id="aCategory">${CATEGORIES.map(c=>`<option value="${c}" ${(a.category||'Autre')===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field full"><label>Investissement associé</label><select id="aInv"><option value="">Aucun</option>${state.investments.map(i=>`<option value="${i.id}" ${a.investment_id===i.id?'selected':''}>${esc(i.name)} — ${money(i.cost)}</option>`).join('')}</select></div>
<div class="field full"><label>Photo</label><input id="aPhoto" type="file" accept="image/*" onchange="previewPhoto(event)">${a.photo?`<img id="photoPreview" class="photo-lg" src="${a.photo}">`:'<img id="photoPreview" class="photo-lg hidden">'}</div>
<div class="field full"><label>Description</label><textarea id="aDesc">${esc(a.description||'')}</textarea></div></div>
<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveArticle()">Enregistrer</button>${id?`<button class="btn" onclick="openSale('${id}')">VENDU</button>`:''}</div>`)}
function previewPhoto(e){const f=e.target.files?.[0],img=$('#photoPreview');if(!f||!img)return;const r=new FileReader();r.onload=()=>{img.src=r.result;img.classList.remove('hidden');img.dataset.newPhoto=r.result};r.readAsDataURL(f)}
async function compressPhoto(data){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=data})}
async function saveArticle(){const title=String($('#aTitle')?.value??'').trim(),rawBuy=String($('#aBuy')?.value??'').trim().replace(',','.'),buy=num(rawBuy);if(!title)return alert('Le nom de l’article est obligatoire.');if(rawBuy===''||buy<=0)return alert('Le prix d’achat doit être supérieur à 0 €.');const old=state.articles.find(a=>a.id===editingId),img=$('#photoPreview');let photo=old?.photo||'';if(img?.dataset.newPhoto)photo=await compressPhoto(img.dataset.newPhoto);const a={id:editingId||uid(),title,type:$('#aType').value.trim(),brand:$('#aBrand').value.trim(),purchase_price:buy,sale_price:num($('#aSale').value),size:$('#aSize').value.trim(),condition:$('#aCond').value.trim(),category:$('#aCategory').value,investment_id:$('#aInv').value||null,photo,description:$('#aDesc').value.trim(),status:old?.status==='sold'?'sold':'for_sale',created_at:old?.created_at||isoDate(new Date()),updated_at:isoDate(new Date())};if(editingId){const i=state.articles.findIndex(x=>x.id===editingId);state.articles[i]=a}else state.articles.push(a);saveLocal();closeModal();render();await pushCloud()}
function openSale(id){saleArticleId=id;const a=state.articles.find(x=>x.id===id);openModal('Enregistrer la vente',`<div class="notice">Article : <b>${esc(a?.title)}</b></div><div class="form section"><div class="field"><label>Prix réel de vente (€) *</label><input id="sPrice" type="number" step=".01" value="${a?.sale_price||''}"></div><div class="field"><label>Date de vente *</label><input id="sDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></div><div class="field full"><label>Investissement</label><select id="sInv"><option value="">Aucun</option>${state.investments.map(i=>`<option value="${i.id}" ${(a?.investment_id===i.id)?'selected':''}>${esc(i.name)} — ${money(i.cost)}</option>`).join('')}</select></div><div class="field"><label>Frais éventuels (€)</label><input id="sFees" type="number" step=".01" value="0"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSale()">Confirmer la vente</button></div>`)}
async function saveSale(){const a=state.articles.find(x=>x.id===saleArticleId),price=num($('#sPrice').value);if(!a||price<=0)return alert('Le prix de vente est obligatoire.');const inv=$('#sInv').value||a.investment_id||null;a.investment_id=inv;a.status='sold';a.updated_at=isoDate(new Date());state.sales.push({id:uid(),article_id:a.id,sale_price:price,fees:num($('#sFees').value),sold_at:new Date($('#sDate').value).toISOString(),investment_id:inv});saveLocal();closeModal();render();await pushCloud()}
function openInvestment(id=null){editingId=id;const i=state.investments.find(x=>x.id===id)||{};const types=(i.types||[{name:'',qty:1}]);openModal(id?'Modifier l’investissement':'Nouvel investissement / lot',`<div class="form">
<div class="field"><label>Nom du lot *</label><input id="iName" value="${esc(i.name||'')}"></div><div class="field"><label>Date d'achat *</label><input id="iDate" type="date" value="${i.date?new Date(i.date).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Coût total du lot (€) *</label><input id="iCost" type="number" step=".01" value="${i.cost??''}"></div><div class="field"><label>Nombre total d'articles *</label><input id="iTotal" type="number" min="0" value="${i.total_articles??''}"></div>
<div class="field full"><label>Types d'articles (ex. Polaires ×2, T-shirts ×5)</label><input id="iTypes" value="${esc(types.filter(t=>t.name).map(t=>t.name+' ×'+t.qty).join(', '))}" placeholder="Polaires ×2, T-shirts ×5, Chaussures ×3"></div>
<div class="field full"><label>Note</label><textarea id="iNote">${esc(i.note||'')}</textarea></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveInvestment()">Enregistrer</button></div>`)}
function parseTypes(s){return s.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*[×x]\s*(\d+)$/i);return {name:(m?m[1]:x).trim(),qty:m?num(m[2]):1}})}
async function saveInvestment(){const name=$('#iName').value.trim(),cost=num($('#iCost').value),total=Math.max(0,Math.floor(num($('#iTotal').value)));if(!name||cost<=0)return alert('Nom et coût total obligatoires.');const old=state.investments.find(x=>x.id===editingId),i={id:editingId||uid(),name,cost,total_articles:total,date:new Date($('#iDate').value).toISOString(),types:parseTypes($('#iTypes').value),note:$('#iNote').value.trim(),created_at:old?.created_at||isoDate(new Date())};if(editingId)state.investments[state.investments.findIndex(x=>x.id===editingId)]=i;else state.investments.push(i);saveLocal();closeModal();render();await pushCloud()}
function migrateCategories(){let changed=false;if(!Array.isArray(state.articles)){state.articles=[];changed=true}if(!Array.isArray(state.investments)){state.investments=[];changed=true}if(!Array.isArray(state.sales)){state.sales=[];changed=true}state.articles=state.articles.map(a=>{if(!a.category){changed=true;return {...a,category:'Autre'}}return a});if(!Array.isArray(state.boosts)){state.boosts=[];changed=true}state.version=APP_VERSION;if(changed)saveLocal();}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vinted-manager-v9-backup.json';a.click()}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const f=i.files[0],x=JSON.parse(await f.text());if(!x.investments||!x.articles||!x.sales)throw new Error('Sauvegarde invalide');state=Object.assign(emptyState(),x);state.boosts=Array.isArray(state.boosts)?state.boosts:[];saveLocal();render();await pushCloud()}catch(e){alert(e.message)}};i.click()}
window.addEventListener('online',()=>{if(cloud)pushCloud()});
(async function boot(){migrateCategories();nav();render();const c=getCfg();if(c.url&&c.key){try{cloud=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false}});await pullCloud();subscribeRealtime()}catch(e){setSync('err','Cloud à configurer');console.warn(e)}}else setSync('','Configure Supabase dans Paramètres')})();
</script>
