<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';
const APP_VERSION='V10';
const SYNC_ROW_ID='vinted-manager-v9-main';
const CFG_KEY='vinted_v9_supabase';
const LOCAL_KEY='vinted_v9_local';
const NAV=[
  ['stats','⌂','Accueil'],['listings','◇','Annonces'],['investments','▤','Investissements'],
  ['articles','▣','Articles'],['ledger','▦','Tableau global'],['sales','✓','Vendus'],['boosts','↗','Boost'],['settings','⚙','Paramètres']
];
let page='stats', period='all', chartDays=30, investmentBoardId=null, investmentBoardStatus='all', cloud=null, realtime=null, saving=false, editingId=null, saleArticleId=null, dirty=false, lastCloudSave=null;
const CATEGORIES=['Polaire','T-shirt','Sweat','Pull','Veste','Manteau','Pantalon','Jean','Short','Chaussures','Chemise','Accessoire','Sac','Casquette','Autre'];
let statsCategory='all';

let state=loadLocal();
state.boosts=Array.isArray(state.boosts)?state.boosts:[];
function emptyState(){return {version:APP_VERSION,updated_at:null,investments:[],articles:[],sales:[],boosts:[]};}
function loadLocal(){try{const raw=localStorage.getItem(LOCAL_KEY);if(!raw)return emptyState();const x=JSON.parse(raw);if(!x||typeof x!=='object')return emptyState();const known=['V9','V9.1.1','V9.1.2','V9.1.3','V9.1.4','V9.1.5','V9.1.6','V9.1.7','V9.1.9','V9.2','V9.3','V10'];if(x.version&&!known.includes(x.version))return emptyState();const out=Object.assign(emptyState(),x,{version:APP_VERSION});out.investments=Array.isArray(out.investments)?out.investments:[];out.articles=Array.isArray(out.articles)?out.articles:[];out.sales=Array.isArray(out.sales)?out.sales:[];out.boosts=Array.isArray(out.boosts)?out.boosts:[];return out}catch{return emptyState()}}
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(state))}
function markDirty(message='Modifications locales non sauvegardées'){dirty=true;state.pending_cloud_save=true;saveLocal();updateSaveButton();setSync(cloud?'':'',cloud?message:'Hors ligne · modifications conservées localement')}
function updateSaveButton(){const b=$('#saveCloudBtn');if(!b)return;b.disabled=!cloud||saving;b.classList.toggle('pending',dirty);b.textContent=saving?'⏳ Sauvegarde…':dirty?'☁️ Sauvegarder •':'☁️ Sauvegarder';b.title=dirty?'Des modifications attendent une sauvegarde cloud.':'Envoyer les données vers Supabase';}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num=n=>{const v=String(n??'').trim().replace(',','.');const x=Number(v);return Number.isFinite(x)?x:0};
const uid=()=>crypto.randomUUID();
const isoDate=d=>new Date(d).toISOString();
function setSync(kind,text){$('#sync').className='sync '+kind;$('#syncText').textContent=text}
function nav(){for(const id of ['sideNav','mobileNav']){$('#'+id).innerHTML=NAV.map(([k,ico,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${ico}</span>${t}</button>`).join('')}}
function go(p){page=p;render()}
function toast(msg){setSync('ok',msg);clearTimeout(window.__toast);window.__toast=setTimeout(()=>{if(cloud)setSync('ok','Synchronisé ✓')},2200)}
function periodRange(){
  const now=new Date(), start=new Date(now);
  if(period==='today'){start.setHours(0,0,0,0)}
  if(period==='week'){const day=(now.getDay()+6)%7;start.setDate(now.getDate()-day);start.setHours(0,0,0,0)}
  if(period==='month'){start.setDate(1);start.setHours(0,0,0,0)}
  if(period==='year'){start.setMonth(0,1);start.setHours(0,0,0,0)}
  return period==='all'?null:{start,end:now}
}
function validDate(date){const d=new Date(date);return Number.isFinite(d.getTime())?d:null}
function inPeriod(date){const r=periodRange();if(!r)return true;const d=validDate(date);return !!d&&d>=r.start&&d<=r.end}
function investmentFor(a){return state.investments.find(i=>i.id===a.investment_id)}
function saleFor(a){return state.sales.find(s=>s.article_id===a.id)}
function articleCost(a){return num(a.purchase_price)}
function saleNet(s){return num(s.sale_price)-num(s.fees)}
function categoryMatch(a){return statsCategory==='all'||(a.category||'Autre')===statsCategory}
function unlinkedArticleCostInPeriod(){return state.articles.filter(a=>!a.investment_id&&inPeriod(a.created_at||a.date)).reduce((n,a)=>n+articleCost(a),0)}
function investmentCategoryShare(i,category){
  if(category==='all') return 1;
  const cats=Array.isArray(i.categories)?i.categories:[];
  const total=cats.reduce((n,c)=>n+Math.max(0,num(c.quantity)),0);
  if(total>0){const match=cats.filter(c=>(c.category||'Autre')===category).reduce((n,c)=>n+Math.max(0,num(c.quantity)),0);return match/total;}
  const linked=state.articles.filter(a=>String(a.investment_id||'')===String(i.id));
  const matching=linked.filter(a=>(a.category||'Autre')===category).length;
  return linked.length?matching/linked.length:0;
}
function investedForCategory(category='all'){
  const explicit=state.investments.filter(i=>inPeriod(i.date)).reduce((n,i)=>n+num(i.cost)*investmentCategoryShare(i,category),0);
  const unlinked=state.articles.filter(a=>!a.investment_id&&inPeriod(a.created_at||a.date)&&(category==='all'||(a.category||'Autre')===category)).reduce((n,a)=>n+articleCost(a),0);
  return explicit+unlinked;
}
function totalInvestedForPeriod(){return investedForCategory(statsCategory||'all')}
function totalBoostsForPeriod(){return state.boosts.filter(b=>inPeriod(b.date||b.created_at)).reduce((n,b)=>n+num(b.amount),0)}
function stockPotentialValue(){return state.articles.filter(a=>a.status==='for_sale').reduce((n,a)=>n+num(a.sale_price),0)}
function stats(){
  const articles=state.articles.filter(a=>inPeriod(a.created_at||a.date)&&categoryMatch(a));
  const sales=state.sales.filter(s=>inPeriod(s.sold_at)&&categoryMatch(state.articles.find(a=>a.id===s.article_id)||{}));
  const soldIds=new Set(sales.map(s=>s.article_id));
  const listed=state.articles.filter(a=>a.status==='for_sale'&&categoryMatch(a)&&!soldIds.has(a.id));
  const invested=totalInvestedForPeriod();
  const revenue=sales.reduce((n,s)=>n+saleNet(s),0);
  const costSold=sales.reduce((n,s)=>n+articleCost(state.articles.find(a=>a.id===s.article_id)||{}),0);
  const boosts=totalBoostsForPeriod();
  const profit=revenue-costSold-boosts;
  return {articles,sales,listed,invested,revenue,costSold,boosts,profit,roi:invested?profit/invested*100:0,avgSale:sales.length?revenue/sales.length:0,avgCost:articles.length?invested/articles.length:0,stockValue:stockPotentialValue()};
}
function chartBuckets(){
  const end=new Date();end.setHours(0,0,0,0);const start=new Date(end);start.setDate(start.getDate()-chartDays+1);
  const keyFor=d=>{const x=validDate(d);return x?`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`:''};
  const inChartRange=d=>{const k=keyFor(d);return !!k&&k>=keyFor(start)&&k<=keyFor(end)};
  const buckets=new Map();for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){const copy=new Date(d);buckets.set(keyFor(copy),{date:copy,invest:0,sales:0,profit:0,boost:0})}
  const sales=state.sales.filter(s=>inChartRange(s.sold_at)&&categoryMatch(state.articles.find(a=>a.id===s.article_id)||{}));
  state.investments.filter(i=>inChartRange(i.date)&&(statsCategory==='all'||investmentCategoryShare(i,statsCategory)>0)).forEach(i=>{const b=buckets.get(keyFor(i.date));if(b)b.invest+=num(i.cost)*investmentCategoryShare(i,statsCategory)});
  state.articles.filter(a=>!a.investment_id&&inChartRange(a.created_at||a.date)&&categoryMatch(a)).forEach(a=>{const b=buckets.get(keyFor(a.created_at||a.date));if(b)b.invest+=articleCost(a)});
  sales.forEach(s=>{const b=buckets.get(keyFor(s.sold_at));if(!b)return;b.sales+=saleNet(s);const a=state.articles.find(x=>x.id===s.article_id)||{};b.profit+=saleNet(s)-articleCost(a)});
  state.boosts.filter(b=>inChartRange(b.date||b.created_at)&&(statsCategory==='all'||(b.article_id&&categoryMatch(state.articles.find(a=>a.id===b.article_id)||{})))).forEach(boost=>{const b=buckets.get(keyFor(boost.date||boost.created_at));if(b){b.boost+=num(boost.amount);b.profit-=num(boost.amount)}});
  return [...buckets.values()].map(b=>({...b,label:b.date.toLocaleDateString('fr-BE',{day:'2-digit',month:'short'})}));
}
function statsChart(){
 const rows=chartBuckets();if(!rows.length)return '<div class="empty">Pas encore de données pour afficher le graphique.</div>';
 const metric=document.getElementById('chartMetric')?.value||'sales',names={sales:'Ventes nettes',profit:'Bénéfice après Boost',invest:'Montant investi'},values=rows.map(r=>num(r[metric]));
 let min=Math.min(0,...values),max=Math.max(1,...values);if(max===min)max=min+1;
 const W=Math.max(600,rows.length*24+76),H=265,L=66,R=16,T=18,B=36,plotW=W-L-R,plotH=H-T-B;
 const x=i=>L+(rows.length===1?plotW/2:i*plotW/(rows.length-1)),y=v=>T+(max-v)/(max-min)*plotH,baseline=y(0);
 const grid=[];for(let i=0;i<=4;i++){const v=max-(max-min)*i/4,yy=y(v);grid.push(`<line class="chart-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="chart-label" x="${L-8}" y="${yy+4}" text-anchor="end">${Math.round(v).toLocaleString('fr-BE')} €</text>`)}
 const pts=rows.map((r,i)=>`${x(i)},${y(num(r[metric]))}`).join(' '),line=`<polyline class="chart-series" points="${pts}"/>`,area=`<polygon class="chart-area" points="${x(0)},${baseline} ${pts} ${x(rows.length-1)},${baseline}"/>`,labelStep=rows.length>45?14:7,labels=rows.map((r,i)=>i%labelStep===0||i===rows.length-1?`<text class="chart-label" x="${x(i)}" y="${H-9}" text-anchor="middle">${esc(r.label)}</text>`:'').join('');
 const table=rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${money(r.invest)}</td><td>${money(r.sales)}</td><td>${money(r.profit)}</td></tr>`).join('');
 return `<div class="chart-controls"><label for="chartMetric">Mesure</label><select id="chartMetric" onchange="render()"><option value="sales" ${metric==='sales'?'selected':''}>Ventes nettes</option><option value="profit" ${metric==='profit'?'selected':''}>Bénéfice après Boost</option><option value="invest" ${metric==='invest'?'selected':''}>Montant investi</option></select><label for="chartDays">Période</label><select id="chartDays" onchange="chartDays=Number(this.value);render()"><option value="7" ${chartDays===7?'selected':''}>7 jours</option><option value="30" ${chartDays===30?'selected':''}>30 jours</option><option value="90" ${chartDays===90?'selected':''}>90 jours</option></select></div><div class="chart-caption">${names[metric]} · une valeur par jour · ${chartDays} derniers jours${statsCategory!=='all'?` · ${esc(statsCategory)}`:''}</div><div class="chart-shell"><svg class="line-chart" style="width:${W}px;max-width:none;min-width:0" viewBox="0 0 ${W} ${H}" role="img" aria-label="${names[metric]}, montants en euros, une valeur par jour sur ${chartDays} jours">${grid.join('')}<line class="chart-axis" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/><line class="chart-axis" x1="${L}" y1="${baseline}" x2="${W-R}" y2="${baseline}"/>${area}${line}${labels}</svg></div><details class="chart-data"><summary>Voir les montants exacts par jour</summary><div class="table-wrap"><table class="table"><tr><th>Jour</th><th>Investi</th><th>Ventes nettes</th><th>Bénéfice net</th></tr>${table}</table></div></details>`;
}
function kpi(label,value,note=''){const key=encodeURIComponent(label),interactive=page==='stats';return `<div class="card kpi${interactive?' clickable':''}" ${interactive?`role="button" tabindex="0" onclick="goToKpiDetails(decodeURIComponent('${key}'))" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToKpiDetails(decodeURIComponent('${key}'))}"`:''}><div class="muted">${label}</div><div class="v">${value}</div>${note?`<div class="stat-note">${note}</div>`:''}${interactive?'<span class="kpi-action">Ouvrir →</span>':''}</div>`}
function goToKpiDetails(label){const key=label.toLowerCase(),target=key.includes('en ligne')||key.includes('annonce')||key.includes('stock')||key.includes('en vente')?'listings':key.includes('invest')||key.includes('capital')?'investments':key.includes('boost')?'boosts':key.includes('vente')||key.includes('vendu')||key.includes('bénéfice')||key.includes('rentabilité')?'sales':'articles';go(target);if(statsCategory!=='all'){const select=target==='listings'?$('#listingCategory'):target==='articles'?$('#articleCategory'):null;if(select){select.value=statsCategory;target==='listings'?renderListingsFilter():renderArticlesFilter()}}}
function openKpiDetails(label){
 const inScope=(a)=>inPeriod(a.created_at||a.date)&&categoryMatch(a),sales=state.sales.filter(s=>inPeriod(s.sold_at)&&categoryMatch(state.articles.find(a=>a.id===s.article_id)||{})).sort((a,b)=>new Date(b.sold_at)-new Date(a.sold_at));
 let title=label,items=[];
 const key=label.toLowerCase();
 if(key.includes('vente')||key.includes('vendu'))items=sales.map(s=>{const a=state.articles.find(x=>x.id===s.article_id)||{};return {name:a.title||'Article',meta:`${fmtDate(s.sold_at)} · ${money(s.sale_price)} · bénéfice ${money(saleNet(s)-articleCost(a))}`,photo:a.photo}});
 else if(key.includes('boost')&&!key.includes('bénéfice'))items=state.boosts.filter(b=>inPeriod(b.date||b.created_at)&&(statsCategory==='all'||(b.article_id&&categoryMatch(state.articles.find(a=>a.id===b.article_id)||{})))).map(b=>({name:state.articles.find(a=>a.id===b.article_id)?.title||'Boost non associé',meta:`${fmtDate(b.date||b.created_at)} · ${money(b.amount)} · ${b.note||''}`}));
 else if(key.includes('investissement')||key.includes('investi')){items=state.investments.filter(i=>inPeriod(i.date)&&(statsCategory==='all'||investmentCategoryShare(i,statsCategory)>0)).map(i=>({name:i.name,meta:`${fmtDate(i.date)} · ${money(i.cost*investmentCategoryShare(i,statsCategory==='all'?'all':statsCategory))} · ${state.articles.filter(a=>a.investment_id===i.id).length} article(s)`}));items.push(...state.articles.filter(a=>!a.investment_id&&inPeriod(a.created_at||a.date)&&categoryMatch(a)).map(a=>({name:a.title,meta:`Article sans lot · achat ${money(a.purchase_price)} · ${fmtDate(a.created_at||a.date)}`,photo:a.photo})))}
 else if(key.includes('bénéfice')||key.includes('rentabilité')){items=sales.map(s=>{const a=state.articles.find(x=>x.id===s.article_id)||{};return {name:a.title||'Article',meta:`${fmtDate(s.sold_at)} · vente nette ${money(saleNet(s))} · achat ${money(articleCost(a))} · bénéfice ${money(saleNet(s)-articleCost(a))}`,photo:a.photo}});items.push(...state.boosts.filter(b=>inPeriod(b.date||b.created_at)&&(statsCategory==='all'||(b.article_id&&categoryMatch(state.articles.find(a=>a.id===b.article_id)||{})))).map(b=>({name:'Dépense Boost',meta:`${fmtDate(b.date||b.created_at)} · −${money(b.amount)}`})))}
 else if(key.includes('stock')||key.includes('en vente')||key.includes('annonces')||key.includes('en ligne'))items=state.articles.filter(a=>a.status==='for_sale'&&categoryMatch(a)).map(a=>({name:a.title,meta:`${a.brand||'Sans marque'} · achat ${money(a.purchase_price)} · prévu ${money(a.sale_price)}`,photo:a.photo}));
 else items=state.articles.filter(inScope).map(a=>({name:a.title,meta:`${a.category||'Autre'} · ${a.status==='sold'?'Vendu':'En vente'} · achat ${money(a.purchase_price)} · prévu ${money(a.sale_price)}`,photo:a.photo}));
 const body=items.length?`<div class="list">${items.map(i=>`<div class="list-row">${i.photo?`<img class="photo" src="${i.photo}">`:'<div class="photo" style="display:grid;place-items:center">📦</div>'}<div><b>${esc(i.name)}</b><div class="muted">${esc(i.meta)}</div></div></div>`).join('')}</div>`:'<div class="empty">Aucun élément pour ce chiffre sur la période et la catégorie sélectionnées.</div>';
 openModal(`Détail · ${label}`,body);
}
function render(){nav();const titles={stats:'Bonjour !',listings:'Annonces',investments:'Investissements',boosts:'Boost',articles:'Articles',ledger:'Tableau global',sales:'Vendus',settings:'Paramètres'};$('#pageTitle').textContent=titles[page]||'Vinted Manager';$('#subTitle').textContent=page==='settings'?'Synchronisation PC ↔ téléphone · Supabase':page==='stats'?'Ton activité Vinted, en un coup d’œil':page==='ledger'?'Tous tes articles et leurs chiffres sur une seule page':'Gestion réelle de ta rentabilité';let content='';try{content=page==='stats'?statsPage():page==='listings'?listingsPage():page==='investments'?investmentsPage():page==='boosts'?boostsPage():page==='articles'?articlesPage():page==='ledger'?ledgerPage():page==='sales'?salesPage():settingsPage()}catch(e){console.error('Erreur de rendu',page,e);content=`<div class="card"><h2>Erreur d'affichage</h2><p class="muted">La page n'a pas pu être affichée correctement.</p><div class="notice"><b>${esc(e?.message||String(e))}</b></div><div class="actions"><button class="btn primary" onclick="render()">Réessayer</button></div></div>`}$('#app').innerHTML=content}
function statsPage(){
 state.articles=Array.isArray(state.articles)?state.articles:[];
 state.investments=Array.isArray(state.investments)?state.investments:[];
 state.sales=Array.isArray(state.sales)?state.sales:[];
 state.boosts=Array.isArray(state.boosts)?state.boosts:[];
 const s=stats(),stockValue=s.listed.reduce((n,a)=>n+num(a.sale_price),0);
 return `<div class="periods">${[['today',"Aujourd'hui"],['week','Cette semaine'],['month','Ce mois'],['year','Cette année'],['all','Depuis toujours']].map(x=>`<button class="btn ${period===x[0]?'active':''}" onclick="setPeriod('${x[0]}')">${x[1]}</button>`).join('')}</div>
 <div class="category-pills"><button class="${statsCategory==='all'?'active':''}" onclick="setStatsCategory('all')">Toutes</button>${CATEGORIES.map(c=>`<button class="${statsCategory===c?'active':''}" onclick="setStatsCategory('${c}')">${c}</button>`).join('')}</div>
 <div class="grid dashboard-kpis">${kpi('Ventes nettes',money(s.revenue))}${kpi('Bénéfice net',money(s.profit),'Après frais de vente et Boost')}${kpi('Articles en ligne',s.listed.length)}${kpi('Capital investi',money(s.invested))}</div>

function setStatsCategory(c){statsCategory=c;render()}
function categoryStats(){
 const visibleCategories=statsCategory==='all'?CATEGORIES:[statsCategory];const rows=visibleCategories.map(c=>{const sales=state.sales.filter(s=>inPeriod(s.sold_at)&&(state.articles.find(a=>a.id===s.article_id)?.category||'Autre')===c);const revenue=sales.reduce((n,s)=>n+saleNet(s),0);const cost=sales.reduce((n,s)=>n+articleCost(state.articles.find(a=>a.id===s.article_id)||{}),0);return {c,count:sales.length,revenue,profit:revenue-cost,invested:investedForCategory(c)}}).filter(x=>x.count||x.invested).sort((a,b)=>b.profit-a.profit).slice(0,8);
 return rows.length?`<div class="list">${rows.map(r=>`<div class="list-row" style="grid-template-columns:1fr auto"><div><b>${esc(r.c)}</b><div class="muted">${r.count} vendu(s) · ${money(r.invested)} investi</div></div><strong>${money(r.profit)}</strong></div>`).join('')}</div>`:'<div class="empty">Aucune donnée par catégorie.</div>';
}
function setPeriod(p){period=p;render()}
function salesMini(rows){return rows.length?`<div class="list">${rows.map(s=>{const a=state.articles.find(x=>x.id===s.article_id);return `<div class="list-row"><div>${a?.photo?`<img class="photo" src="${a.photo}">`:'📦'}</div><div><b>${esc(a?.title||'Article')}</b><div class="muted">${new Date(s.sold_at).toLocaleDateString('fr-BE')}</div></div><strong>${money(s.sale_price)}</strong></div>`}).join('')}</div>`:'<div class="empty">Aucune vente sur cette période.</div>'}
function barChart(rows){if(!rows.length)return '<div class="empty">Aucune donnée.</div>';const buckets={};rows.forEach(s=>{const d=new Date(s.sold_at);const k=d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit'});buckets[k]=(buckets[k]||0)+saleNet(s)});const vals=Object.values(buckets),max=Math.max(...vals,1);return `<div class="bar-chart">${Object.entries(buckets).slice(-12).map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/max*160)}px"><span>${money(v)}</span><small>${k}</small></div>`).join('')}</div>`}

function renderArticlesFilter(){const q=($('#articleSearch')?.value||'').toLowerCase(),cat=$('#articleCategory')?.value||'all';const arr=state.articles.filter(a=>(`${a.title} ${a.brand||''} ${a.type||''} ${a.category||''}`.toLowerCase().includes(q))&&(cat==='all'||(a.category||'Autre')===cat));$('#articleBox').innerHTML=articleTable(arr)}

function ledgerFilteredRows(){const q=($('#ledgerSearch')?.value||'').trim().toLowerCase(),inv=$('#ledgerInvestment')?.value||'all';return state.articles.filter(a=>{const investment=investmentFor(a),hay=`${a.title} ${a.brand||''} ${a.type||''} ${a.category||''} ${investment?.name||''}`.toLowerCase();return (inv==='all'||(inv==='none'?!a.investment_id:a.investment_id===inv))&&(!q||hay.includes(q))}).sort((a,b)=>{const an=investmentFor(a)?.name||'Sans investissement',bn=investmentFor(b)?.name||'Sans investissement';return an.localeCompare(bn,'fr')||String(a.title||'').localeCompare(String(b.title||''),'fr')})}

function ledgerPage(){return `<div class="toolbar"><input id="ledgerSearch" placeholder="Rechercher un article ou un lot…" oninput="renderLedger()" style="max-width:320px"><select id="ledgerInvestment" onchange="renderLedger()"><option value="all">Tous les investissements</option>${state.investments.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}<option value="none">Sans investissement</option></select><button class="btn" onclick="downloadLedgerCsv()">Exporter en CSV pour Excel</button></div><div id="ledgerContent">${ledgerTable(ledgerFilteredRows())}</div>`}
function ledgerTable(rows){const totals=rows.reduce((x,a)=>{const s=saleFor(a);x.count++;if(s){x.revenue+=saleNet(s);x.profit+=ledgerResult(a)}return x},{count:0,revenue:0,profit:0});return `<div class="ledger-summary"><div><span>Articles affichés</span><b>${totals.count}</b></div><div><span>Ventes nettes réalisées</span><b>${money(totals.revenue)}</b></div><div><span>Bénéfice net réalisé</span><b>${money(totals.profit)}</b></div></div><div class="card ledger-card"><div class="table-wrap"><table class="table ledger-table"><thead><tr><th>Date</th><th>Article</th><th>Investissement</th><th>Catégorie</th><th>Statut</th><th>Achat</th><th>Prévu</th><th>Vente réelle</th><th>Frais</th><th>Boost</th><th>Résultat / marge</th></tr></thead><tbody>${rows.length?rows.map(a=>{const sale=saleFor(a),boost=ledgerBoost(a),result=ledgerResult(a),date=sale?.sold_at||a.created_at;return `<tr onclick="openArticle('${a.id}')"><td>${fmtDate(date)}</td><td class="ledger-name">${a.photo?`<img class="photo" src="${a.photo}" alt="">`:''}<span>${esc(a.title)}</span></td><td>${esc(investmentFor(a)?.name||'Sans lot')}</td><td>${esc(a.category||'Autre')}</td><td><span class="badge ${sale?'green':'blue'}">${sale?'Vendu':'En vente'}</span></td><td>${money(a.purchase_price)}</td><td>${money(a.sale_price)}</td><td>${sale?money(sale.sale_price):'—'}</td><td>${sale?money(sale.fees):'—'}</td><td>${money(boost)}</td><td class="${result<0?'negative-value':''}">${money(result)}${sale?'':' prévu'}</td></tr>`}).join(''):'<tr><td colspan="11"><div class="empty">Aucun article ne correspond à cette recherche.</div></td></tr>'}</tbody></table></div></div>`}
function renderLedger(){const host=$('#ledgerContent');if(host)host.innerHTML=ledgerTable(ledgerFilteredRows())}
function csvCell(value){let s=String(value??'');if(!/^-?\d+(?:,\d+)?$/.test(s)&&/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadLedgerCsv(){const rows=ledgerFilteredRows(),amount=n=>num(n).toFixed(2).replace('.',','),matrix=[['Date','Article','Marque','Catégorie','Investissement','Statut','Prix achat (€)','Prix prévu (€)','Prix vente réel (€)','Frais (€)','Boost (€)','Résultat net ou marge prévue (€)']];rows.forEach(a=>{const sale=saleFor(a);matrix.push([fmtDate(sale?.sold_at||a.created_at),a.title,a.brand||'',a.category||'Autre',investmentFor(a)?.name||'Sans investissement',sale?'Vendu':'En vente',amount(a.purchase_price),amount(a.sale_price),sale?amount(sale.sale_price):'',sale?amount(sale.fees):'',amount(ledgerBoost(a)),amount(ledgerResult(a))])});const csv='\uFEFF'+matrix.map(row=>row.map(csvCell).join(';')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='vinted-manager-tableau.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}

function investmentsPage(){const unlinked=state.articles.filter(a=>!a.investment_id).reduce((n,a)=>n+articleCost(a),0);return `<div class="toolbar"><button class="btn primary" onclick="openInvestment()">+ Nouvel investissement / lot</button>${state.investments.length?`<label class="investment-picker-label" for="investmentPicker">Ouvrir un tableau</label><select id="investmentPicker" onchange="if(this.value)openInvestmentDetails(this.value)"><option value="">Choisir un investissement…</option>${state.investments.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select>`:''}</div><div class="notice section">Chaque investissement possède son propre tableau d’articles et de photos. Les articles sans investissement associé sont ajoutés individuellement au montant investi (${money(unlinked)} actuellement).</div><div class="grid3 section">${state.investments.map(i=>investmentCard(i)).join('')||'<div class="empty">Aucun investissement.</div>'}</div>`}
function investmentCard(i){const linked=state.articles.filter(a=>a.investment_id===i.id),sold=linked.filter(a=>saleFor(a)),recovered=sold.reduce((n,a)=>n+saleNet(saleFor(a)),0),boosts=state.boosts.filter(b=>b.article_id&&linked.some(a=>a.id===b.article_id)).reduce((n,b)=>n+num(b.amount),0),profit=recovered-num(i.cost)-boosts,remaining=Math.max(0,num(i.cost)-recovered),roi=num(i.cost)?profit/num(i.cost)*100:0;return `<div class="card investment-card" role="button" tabindex="0" onclick="openInvestmentDetails('${i.id}')" onkeydown="if(event.key==='Enter'){openInvestmentDetails('${i.id}')}"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(i.name)}</h3><span class="badge ${recovered>=num(i.cost)?'green':'orange'}">${recovered>=num(i.cost)?'Rentabilisé':'En cours'}</span></div><div class="muted">${fmtDate(i.date)} · ${i.types?.map(t=>esc(t.name)+' × '+t.qty).join(' · ')||''}</div><div class="section">${kpi('Coût total',money(i.cost))}</div><div class="grid3 section">${kpi('Articles',i.total_articles)}${kpi('Vendus',sold.length)}${kpi('Restants',Math.max(0,num(i.total_articles)-sold.length))}</div><div class="section"><div class="muted">Montant généré</div><h3>${money(recovered)}</h3><div class="progress"><i style="width:${Math.min(100,recovered/Math.max(1,num(i.cost))*100)}%"></i></div></div><div class="grid3 section">${kpi('Bénéfice',money(profit))}${kpi('Rentabilité',roi.toFixed(2)+' %')}${kpi('Reste à récupérer',money(remaining))}</div><div class="actions"><button class="btn" onclick="event.stopPropagation();openInvestment('${i.id}')">Modifier</button></div><div class="stat-note">Cliquer pour voir les articles du lot</div></div>`}
function investmentBoardItems(){const id=investmentBoardId,q=($('#investmentBoardSearch')?.value||'').trim().toLowerCase(),status=$('#investmentBoardStatus')?.value||investmentBoardStatus;const articles=state.articles.filter(a=>a.investment_id===id&&(!q||`${a.title} ${a.brand||''} ${a.category||''} ${a.size||''}`.toLowerCase().includes(q))&&(status==='all'||(status==='sold'?!!saleFor(a):a.status==='for_sale'&&!saleFor(a)))).sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at));return articles.length?articles.map(a=>{const sale=saleFor(a),profit=sale?saleNet(sale)-articleCost(a):num(a.sale_price)-articleCost(a);return `<button class="board-item" type="button" onclick="openArticle('${a.id}')">${a.photo?`<img class="board-photo" src="${a.photo}" alt="${esc(a.title)}">`:'<div class="board-photo board-photo-empty">📦</div>'}<span class="board-item-body"><span class="board-item-title">${esc(a.title)}</span><span class="muted">${esc(a.brand||'Sans marque')} · ${esc(a.size||'Taille non précisée')}</span><span class="board-item-row"><span class="badge ${sale?'green':'blue'}">${sale?'Vendu':'En vente'}</span><b>${money(sale?sale.sale_price:a.sale_price)}</b></span><span class="board-item-meta">Achat ${money(a.purchase_price)} · ${sale?'Résultat':'Marge prévue'} ${money(profit)}</span></span></button>`}).join(''):'<div class="empty">Aucun article ne correspond à ce filtre.</div>'}

function boostsPage(){const rows=state.boosts.slice().sort((a,b)=>new Date(b.date||b.created_at)-new Date(a.date||a.created_at));const total=state.boosts.reduce((n,b)=>n+num(b.amount),0);return `<div class="toolbar"><button class="btn primary" onclick="openBoost()">+ Ajouter un Boost</button></div><div class="grid">${kpi('Total Boost dépensé',money(total))}${kpi('Nombre de Boosts',state.boosts.length)}</div><div class="card section"><div class="table-wrap">${rows.length?`<table class="table"><tr><th>Date</th><th>Article</th><th>Montant</th><th>Note</th><th></th></tr>${rows.map(b=>{const a=state.articles.find(x=>x.id===b.article_id);return `<tr><td>${fmtDate(b.date||b.created_at)}</td><td>${esc(a?.title||'Tous / non associé')}</td><td>${money(b.amount)}</td><td>${esc(b.note||'')}</td><td><button class="btn danger" onclick="removeBoost('${b.id}')">Supprimer</button></td></tr>`}).join('')}</table>`:'<div class="empty">Aucun Boost enregistré.</div>'}</div></div>`}
function openBoost(){openModal('Ajouter un Boost',`<div class="form"><div class="field"><label>Montant du Boost (€) *</label><input id="bAmount" type="number" step=".01" min="0" placeholder="2.50"></div><div class="field"><label>Date *</label><input id="bDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Article associé (optionnel)</label><select id="bArticle"><option value="">Tous / non associé</option>${state.articles.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select></div><div class="field full"><label>Note</label><input id="bNote" placeholder="Ex. Boost 3 jours"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveBoost()">Enregistrer</button></div>`)}

function settingsPage(){const cfg=getCfg();return `<div class="grid3"><div class="card"><h2>☁️ Synchronisation</h2><p class="muted">Les deux appareils utilisent la même ligne Supabase V9.</p><div class="notice">Après avoir enregistré l'URL et la clé sur le PC, utilise exactement les mêmes valeurs sur le téléphone.</div><p id="syncInfo" class="stat-note">${cloud?'Cloud connecté':'Cloud non connecté'}</p></div><div class="card"><h2>Supabase</h2><div class="form"><div class="field full"><label>Project URL</label><input id="cfgUrl" value="${esc(cfg.url)}" placeholder="https://xxxx.supabase.co"></div><div class="field full"><label>Publishable key</label><input id="cfgKey" value="${esc(cfg.key)}" placeholder="sb_publishable_..."></div></div><div class="actions"><button class="btn primary" onclick="connectCloud()">Tester et connecter</button><button class="btn" onclick="disconnectCloud()">Déconnecter</button></div></div><div class="card"><h2>Données locales</h2><p class="muted">Une copie locale est conservée. Après tes modifications, utilise le bouton « Sauvegarder » en haut pour envoyer l’ensemble des données au cloud.</p><div class="actions"><button class="btn" onclick="forcePull()">Recharger depuis Supabase</button><button class="btn" onclick="downloadBackup()">Exporter</button><button class="btn" onclick="importBackup()">Importer</button></div></div></div>`}
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{url:'',key:''}}catch{return {url:'',key:''}}}
async function connectCloud(){const url=$('#cfgUrl').value.trim().replace(/\/$/,''),key=$('#cfgKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||key.length<20)return alert('Project URL ou clé Publishable invalide.');localStorage.setItem(CFG_KEY,JSON.stringify({url,key}));try{cloud=window.supabase.createClient(url,key,{auth:{persistSession:false}});const {error}=await cloud.from('vinted_v9_state').select('id').eq('id',SYNC_ROW_ID).maybeSingle();if(error)throw error;setSync('ok','Cloud connecté ✓');await pullCloud();subscribeRealtime();render();updateSaveButton()}catch(e){cloud=null;setSync('err','Erreur Supabase');alert('Impossible de se connecter : '+e.message)}}
function disconnectCloud(){if(realtime&&cloud)cloud.removeChannel(realtime);realtime=null;cloud=null;setSync('','Déconnecté');render()}
async function ensureCloud(){if(cloud)return true;const c=getCfg();if(!c.url||!c.key)return false;try{cloud=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false}});return true}catch{return false}}
async function saveToCloud(){
  if(saving)return;
  if(!await ensureCloud()){setSync('err','Cloud non connecté');alert('Connecte d’abord Supabase dans Paramètres.');updateSaveButton();return}
  saving=true;updateSaveButton();setSync('','Envoi des données vers le cloud…');
  const snapshot=JSON.parse(JSON.stringify(state));
  try{
    const payload=Object.assign({},snapshot,{version:APP_VERSION,pending_cloud_save:false,updated_at:isoDate(new Date())});
    const {error}=await cloud.from('vinted_v9_state').upsert({id:SYNC_ROW_ID,state:payload,updated_at:payload.updated_at},{onConflict:'id'});
    if(error)throw error;
    state.pending_cloud_save=false;state.updated_at=payload.updated_at;dirty=false;lastCloudSave=payload.updated_at;saveLocal();
    setSync('ok','Sauvegarde cloud confirmée ✓');
    updateSaveButton();
    render();
  }catch(e){
    state=snapshot;state.pending_cloud_save=true;dirty=true;saveLocal();setSync('err','Échec de sauvegarde · données locales conservées');updateSaveButton();
    console.error('Erreur sauvegarde Supabase:',e);
    alert('La sauvegarde cloud a échoué. Tes données restent conservées sur cet appareil.\\n\\nDétail : '+(e?.message||String(e)));
  }finally{saving=false;updateSaveButton()}
}
async function pullCloud(){
  if(!await ensureCloud())return;
  setSync('','Synchronisation…');
  const localBefore=Object.assign(emptyState(),state);
  try{
    const {data,error}=await cloud.from('vinted_v9_state').select('state,updated_at').eq('id',SYNC_ROW_ID).maybeSingle();
    if(error)throw error;
    const remote=data?.state&&typeof data.state==='object'?data.state:null;
    const localCount=(localBefore.articles?.length||0)+(localBefore.investments?.length||0)+(localBefore.sales?.length||0);
    const remoteCount=(remote?.articles?.length||0)+(remote?.investments?.length||0)+(remote?.sales?.length||0);
    if(localBefore.pending_cloud_save){
      state=localBefore;dirty=true;saveLocal();setSync('','Modifications locales en attente de sauvegarde');render();updateSaveButton();return;
    }else if(remote&&remoteCount>0){
      state=Object.assign(emptyState(),remote,{version:APP_VERSION});
      state.investments=Array.isArray(state.investments)?state.investments:[];
      state.articles=Array.isArray(state.articles)?state.articles:[];
      state.sales=Array.isArray(state.sales)?state.sales:[];
      state.boosts=Array.isArray(state.boosts)?state.boosts:[];
      state.updated_at=data.updated_at||state.updated_at;
      saveLocal();
    }else if(localCount>0){
      state=localBefore;
      state.pending_cloud_save=true;dirty=true;saveLocal();
      setSync('','Données locales conservées · appuie sur Sauvegarder');
      render();
      return;
    }else{
      state=Object.assign(emptyState(),remote||{});
      saveLocal();
    }
    setSync('ok','Synchronisé ✓');
    render();
  }catch(e){
    state=localBefore;
    saveLocal();
    setSync('err','Cloud indisponible · données locales conservées');
    render();
    console.error(e);
  }
}
function subscribeRealtime(){if(!cloud)return;if(realtime)cloud.removeChannel(realtime);realtime=cloud.channel('vinted-v9-sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'vinted_v9_state',filter:`id=eq.${SYNC_ROW_ID}`},p=>{if(!saving&&!dirty&&p.new?.state){state=Object.assign(emptyState(),p.new.state);saveLocal();render();updateSaveButton();setSync('ok','Mis à jour depuis un autre appareil ✓')}}).subscribe()}
async function forcePull(){try{await pullCloud()}catch(e){alert(e.message)}}
function fmtDate(d){const x=validDate(d);return x?x.toLocaleDateString('fr-BE'):'—'}
function openModal(title,body){$('#modal').classList.remove('wide');$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open','wide');editingId=null;saleArticleId=null}
let captureImage=null,captureCanvas=null,captureSelection=null,captureDrag=null;
function openCaptureImport(){captureImage=null;captureCanvas=null;captureSelection=null;openModal('Créer un article depuis une capture',`<p class="muted">Choisis une capture de ton annonce. Le texte est lu sur ton appareil; tu pourras corriger les champs avant l’ajout.</p><div class="field"><label>Capture d’écran</label><input id="captureFile" type="file" accept="image/*" onchange="loadCaptureImage(event)"></div><div class="capture-canvas-wrap section"><canvas id="captureCanvas" class="hidden"></canvas><div id="capturePlaceholder" class="empty">Sélectionne une image pour commencer. Fais glisser sur l’image pour choisir la photo à conserver.</div></div><div id="captureStatus" class="capture-status section"></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button id="captureAnalyze" class="btn primary" onclick="analyzeCapture()" disabled>Analyser et remplir</button></div>`);initCaptureCanvas()}
function loadCaptureImage(e){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return alert('Choisis une image.');const img=new Image();img.onload=()=>{captureImage=img;captureSelection=null;captureCanvas=$('#captureCanvas');const scale=Math.min(1,1000/img.width,650/img.height);captureCanvas.width=Math.round(img.width*scale);captureCanvas.height=Math.round(img.height*scale);captureCanvas.classList.remove('hidden');$('#capturePlaceholder').classList.add('hidden');drawCaptureCanvas();$('#captureAnalyze').disabled=false;$('#captureStatus').textContent='Zone photo facultative : fais glisser pour la recadrer. Sans sélection, l’image complète sera utilisée.'};img.onerror=()=>$('#captureStatus').textContent='Impossible de lire cette image.';img.src=URL.createObjectURL(file)}
function drawCaptureCanvas(){if(!captureImage||!captureCanvas)return;const c=captureCanvas.getContext('2d'),w=captureCanvas.width,h=captureCanvas.height;c.clearRect(0,0,w,h);c.drawImage(captureImage,0,0,w,h);if(captureSelection){const r=captureSelection;c.fillStyle='#0009';c.fillRect(0,0,w,h);c.clearRect(r.x,r.y,r.w,r.h);c.drawImage(captureImage,0,0,w,h);c.fillStyle='#0005';c.fillRect(0,0,w,r.y);c.fillRect(0,r.y+r.h,w,h-r.y-r.h);c.fillRect(0,r.y,r.x,r.h);c.fillRect(r.x+r.w,r.y,w-r.x-r.w,r.h);c.strokeStyle='#22ffd0';c.lineWidth=2;c.strokeRect(r.x,r.y,r.w,r.h)}}
function initCaptureCanvas(){captureCanvas=$('#captureCanvas');if(!captureCanvas)return;const point=e=>{const r=captureCanvas.getBoundingClientRect();return {x:Math.max(0,Math.min(captureCanvas.width,(e.clientX-r.left)*captureCanvas.width/r.width)),y:Math.max(0,Math.min(captureCanvas.height,(e.clientY-r.top)*captureCanvas.height/r.height))}};captureCanvas.onpointerdown=e=>{captureDrag=point(e);captureCanvas.setPointerCapture(e.pointerId);captureSelection={x:captureDrag.x,y:captureDrag.y,w:0,h:0}};captureCanvas.onpointermove=e=>{if(!captureDrag)return;const p=point(e);captureSelection={x:Math.min(p.x,captureDrag.x),y:Math.min(p.y,captureDrag.y),w:Math.abs(p.x-captureDrag.x),h:Math.abs(p.y-captureDrag.y)};drawCaptureCanvas()};captureCanvas.onpointerup=()=>{captureDrag=null;if(captureSelection&&(captureSelection.w<30||captureSelection.h<30))captureSelection=null;drawCaptureCanvas()}}
function captureCropData(){if(!captureImage)return '';const sx=captureCanvas.width/captureImage.width,sy=captureCanvas.height/captureImage.height,r=captureSelection;if(!r)return captureCanvas.toDataURL('image/jpeg',.88);const x=Math.round(r.x/sx),y=Math.round(r.y/sy),w=Math.round(r.w/sx),h=Math.round(r.h/sy),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(captureImage,x,y,w,h,0,0,w,h);return c.toDataURL('image/jpeg',.88)}
function guessCaptureFields(text){const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),priceHit=text.match(/(?:€\s*)?(\d{1,4}(?:[.,]\d{1,2})?)\s*€/i)||text.match(/€\s*(\d{1,4}(?:[.,]\d{1,2})?)/i),noise=/^(vinted|favoris|favoris|message|messagerie|acheter|faire une offre|partager|retour|accueil|recherche|rechercher|profil|livraison|protection acheteurs|en ligne|il y a \d|voir plus|description)$/i;const title=lines.filter(x=>/[A-Za-zÀ-ÿ]/.test(x)&&x.length>=5&&!noise.test(x)&&!/(€|\d+[.,]\d{2})/.test(x)).sort((a,b)=>b.length-a.length)[0]||'';const lower=(title+' '+text).toLowerCase();const category=CATEGORIES.find(c=>c!=='Autre'&&lower.includes(c.toLowerCase()))||'Autre';return {title,price:priceHit?priceHit[1].replace(',','.'): '',category}}
async function analyzeCapture(){if(!captureImage)return;const status=$('#captureStatus'),button=$('#captureAnalyze');button.disabled=true;status.textContent='Lecture du texte… la première analyse peut prendre quelques secondes.';try{if(!window.Tesseract)throw new Error('Le module OCR n’est pas chargé. Vérifie la connexion puis réessaie.');const worker=await Tesseract.createWorker('fra+eng');let result;try{result=await worker.recognize(captureCanvas.toDataURL('image/png'))}finally{await worker.terminate()}const guesses=guessCaptureFields(result.data.text||'');const photo=captureCropData();closeModal();openArticle();if(guesses.title)$('#aTitle').value=guesses.title;if(guesses.price)$('#aSale').value=guesses.price;$('#aCategory').value=guesses.category;const preview=$('#photoPreview');if(photo){preview.src=photo;preview.classList.remove('hidden');preview.dataset.newPhoto=photo}if(!guesses.title&&!guesses.price)alert('Je n’ai pas réussi à lire le titre ou le prix. La photo est ajoutée; complète les champs à la main.')}catch(e){status.textContent=e.message||'La lecture du texte a échoué.';button.disabled=false}}
function openArticle(id=null){editingId=id;const a=state.articles.find(x=>x.id===id)||{};openModal(id?'Modifier l’article':'Nouvel article',`<div class="form">
<div class="field full"><label>Nom de l'article *</label><input id="aTitle" value="${esc(a.title||'')}"></div>
<div class="field"><label>Type</label><input id="aType" value="${esc(a.type||'')}"></div><div class="field"><label>Marque</label><input id="aBrand" value="${esc(a.brand||'')}"></div>
<div class="field"><label>Prix d'achat (€) *</label><input id="aBuy" type="number" step=".01" value="${a.purchase_price??''}"></div><div class="field"><label>Prix de vente prévu (€)</label><input id="aSale" type="number" step=".01" value="${a.sale_price??''}"></div>
<div class="field"><label>Taille</label><input id="aSize" value="${esc(a.size||'')}"></div><div class="field"><label>État</label><input id="aCond" value="${esc(a.condition||'')}"></div>
<div class="field full"><label>Catégorie</label><select id="aCategory">${CATEGORIES.map(c=>`<option value="${c}" ${(a.category||'Autre')===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field full"><label>Investissement associé</label><select id="aInv"><option value="">Aucun</option>${state.investments.map(i=>`<option value="${i.id}" ${a.investment_id===i.id?'selected':''}>${esc(i.name)} — ${money(i.cost)}</option>`).join('')}</select></div>
<div class="field full"><label>Photo</label><input id="aPhoto" type="file" accept="image/*" onchange="previewPhoto(event)">${a.photo?`<img id="photoPreview" class="photo-lg" src="${a.photo}">`:'<img id="photoPreview" class="photo-lg hidden">'}</div>
<div class="field full"><label>Description</label><textarea id="aDesc">${esc(a.description||'')}</textarea></div></div>
<div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveArticle()">Enregistrer</button>${id?`<button class="btn" onclick="openSale('${id}')">VENDU</button>`:''}</div>`)}
function previewPhoto(e){const f=e.target.files?.[0],img=$('#photoPreview');if(!f||!img)return;const r=new FileReader();r.onload=()=>{img.src=r.result;img.classList.remove('hidden');img.dataset.newPhoto=r.result};r.readAsDataURL(f)}
async function compressPhoto(data){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const max=800,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=data})}
async function saveArticle(){const title=String($('#aTitle')?.value??'').trim(),rawBuy=String($('#aBuy')?.value??'').trim().replace(',','.'),buy=num(rawBuy);if(!title)return alert('Le nom de l’article est obligatoire.');if(rawBuy===''||buy<=0)return alert('Le prix d’achat doit être supérieur à 0 €.');const old=state.articles.find(a=>a.id===editingId),img=$('#photoPreview');let photo=old?.photo||'';if(img?.dataset.newPhoto)photo=await compressPhoto(img.dataset.newPhoto);const a={id:editingId||uid(),title,type:$('#aType').value.trim(),brand:$('#aBrand').value.trim(),purchase_price:buy,sale_price:num($('#aSale').value),size:$('#aSize').value.trim(),condition:$('#aCond').value.trim(),category:$('#aCategory').value,investment_id:$('#aInv').value||null,photo,description:$('#aDesc').value.trim(),status:old?.status==='sold'?'sold':'for_sale',created_at:old?.created_at||isoDate(new Date()),updated_at:isoDate(new Date())};if(editingId){const i=state.articles.findIndex(x=>x.id===editingId);state.articles[i]=a}else state.articles.push(a);markDirty();closeModal();render();updateSaveButton()}
function openSale(id){saleArticleId=id;const a=state.articles.find(x=>x.id===id);openModal('Enregistrer la vente',`<div class="notice">Article : <b>${esc(a?.title)}</b></div><div class="form section"><div class="field"><label>Prix réel de vente (€) *</label><input id="sPrice" type="number" step=".01" value="${a?.sale_price||''}"></div><div class="field"><label>Date de vente *</label><input id="sDate" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"></div><div class="field full"><label>Investissement</label><select id="sInv"><option value="">Aucun</option>${state.investments.map(i=>`<option value="${i.id}" ${(a?.investment_id===i.id)?'selected':''}>${esc(i.name)} — ${money(i.cost)}</option>`).join('')}</select></div><div class="field"><label>Frais éventuels (€)</label><input id="sFees" type="number" step=".01" value="0"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveSale()">Confirmer la vente</button></div>`)}
async function saveSale(){const a=state.articles.find(x=>x.id===saleArticleId),price=num($('#sPrice').value);if(!a||price<=0)return alert('Le prix de vente est obligatoire.');const inv=$('#sInv').value||a.investment_id||null;a.investment_id=inv;a.status='sold';a.updated_at=isoDate(new Date());state.sales.push({id:uid(),article_id:a.id,sale_price:price,fees:num($('#sFees').value),sold_at:new Date($('#sDate').value).toISOString(),investment_id:inv});markDirty();closeModal();render();updateSaveButton()}
function openInvestment(id=null){editingId=id;const i=state.investments.find(x=>x.id===id)||{};const types=(i.types||[{name:'',qty:1}]);openModal(id?'Modifier l’investissement':'Nouvel investissement / lot',`<div class="form">
<div class="field"><label>Nom du lot *</label><input id="iName" value="${esc(i.name||'')}"></div><div class="field"><label>Date d'achat *</label><input id="iDate" type="date" value="${i.date?new Date(i.date).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}"></div>
<div class="field"><label>Coût total du lot (€) *</label><input id="iCost" type="number" step=".01" value="${i.cost??''}"></div><div class="field"><label>Nombre total d'articles *</label><input id="iTotal" type="number" min="0" value="${i.total_articles??''}"></div>
<div class="field full"><label>Types d'articles (ex. Polaires ×2, T-shirts ×5)</label><input id="iTypes" value="${esc(types.filter(t=>t.name).map(t=>t.name+' ×'+t.qty).join(', '))}" placeholder="Polaires ×2, T-shirts ×5, Chaussures ×3"></div>
<div class="field full"><label>Note</label><textarea id="iNote">${esc(i.note||'')}</textarea></div></div><div class="actions"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveInvestment()">Enregistrer</button></div>`)}
function parseTypes(s){return s.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.*?)\s*[×x]\s*(\d+)$/i);return {name:(m?m[1]:x).trim(),qty:m?num(m[2]):1}})}
async function saveInvestment(){const name=$('#iName').value.trim(),cost=num($('#iCost').value),total=Math.max(0,Math.floor(num($('#iTotal').value)));if(!name||cost<=0)return alert('Nom et coût total obligatoires.');const old=state.investments.find(x=>x.id===editingId),i={id:editingId||uid(),name,cost,total_articles:total,date:new Date($('#iDate').value).toISOString(),types:parseTypes($('#iTypes').value),note:$('#iNote').value.trim(),created_at:old?.created_at||isoDate(new Date())};if(editingId)state.investments[state.investments.findIndex(x=>x.id===editingId)]=i;else state.investments.push(i);markDirty();closeModal();render();updateSaveButton()}
function migrateCategories(){let changed=false;if(!Array.isArray(state.articles)){state.articles=[];changed=true}if(!Array.isArray(state.investments)){state.investments=[];changed=true}if(!Array.isArray(state.sales)){state.sales=[];changed=true}state.articles=state.articles.map(a=>{if(!a.category){changed=true;return {...a,category:'Autre'}}return a});if(!Array.isArray(state.boosts)){state.boosts=[];changed=true}state.version=APP_VERSION;if(changed)saveLocal();}
function downloadBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vinted-manager-v10-backup.json';a.click()}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const f=i.files[0],x=JSON.parse(await f.text());if(!x.investments||!x.articles||!x.sales)throw new Error('Sauvegarde invalide');state=Object.assign(emptyState(),x);state.boosts=Array.isArray(state.boosts)?state.boosts:[];markDirty();render();updateSaveButton()}catch(e){alert(e.message)}};i.click()}
window.addEventListener('online',()=>{if(cloud&&dirty)setSync('','Connexion rétablie · sauvegarde à lancer')});
(async function boot(){migrateCategories();dirty=!!state.pending_cloud_save;nav();render();updateSaveButton();const c=getCfg();if(c.url&&c.key){try{cloud=window.supabase.createClient(c.url,c.key,{auth:{persistSession:false}});await pullCloud();subscribeRealtime();updateSaveButton()}catch(e){setSync('err','Cloud à configurer');console.warn(e)}}else setSync('','Configure Supabase dans Paramètres')})();
</script>
